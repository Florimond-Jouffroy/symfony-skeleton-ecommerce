name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  qa:
    name: Quality (CS + PHPStan + Tests)
    runs-on: ubuntu-latest

    services:
      database:
        image: mariadb:10.11
        env:
          MARIADB_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

    env:
      APP_ENV: test
      # Bases de test (main + log) sur le service MariaDB, accessibles en 127.0.0.1.
      # Ces variables d'env réelles priment sur les fichiers .env* (Symfony Dotenv).
      DATABASE_URL: "mysql://root:root@127.0.0.1:3306/app_test?serverVersion=mariadb-10.11.2&charset=utf8mb4"
      LOG_DATABASE_URL: "mysql://root:root@127.0.0.1:3306/app_log?serverVersion=mariadb-10.11.2&charset=utf8mb4"

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: ctype, iconv, pdo_mysql, intl, mbstring
          coverage: none
          tools: composer:v2

      # Les bundles florimond/* sont des dépôts GitHub privés : un token avec accès
      # en lecture à ces repos est requis. Créer un secret de dépôt `CI_GITHUB_TOKEN`
      # (PAT classic scope `repo`, ou fine-grained avec accès aux 3 repos florimond).
      - name: Configure Composer auth for private bundles
        run: composer config --global github-oauth.github.com "${{ secrets.CI_GITHUB_TOKEN }}"

      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-${{ hashFiles('composer.lock') }}
          restore-keys: composer-

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress --no-scripts

      - name: PHP-CS-Fixer (dry-run)
        run: vendor/bin/php-cs-fixer fix --config=.php-cs-fixer.dist.php --dry-run --diff

      - name: PHPStan
        run: vendor/bin/phpstan analyse --no-progress --memory-limit=1G

      - name: Prepare test databases
        run: |
          php bin/console --env=test doctrine:database:create --if-not-exists --connection=default
          php bin/console --env=test doctrine:schema:create --em=default
          php bin/console --env=test doctrine:database:create --if-not-exists --connection=log

      - name: PHPUnit
        run: vendor/bin/phpunit -c phpunit.dist.xml
